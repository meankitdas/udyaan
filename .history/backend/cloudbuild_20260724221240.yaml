# Google Cloud Build: build, push to Artifact Registry, deploy to Cloud Run.
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_SERVICE=udyaan-api
substitutions:
  _REGION: asia-south1
  _SERVICE: udyaan-api
  _REPO: udyaan
  _FRONTEND_URL: https://udyaan.org
  _MAIL_FROM: info@udyaan.org

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT=$PROJECT_ID,FRONTEND_URL=${_FRONTEND_URL},MAIL_FROM=${_MAIL_FROM}
      - --update-secrets=AZURE_OPENAI_API_KEY=azure-openai-api-key:latest,JWT_SECRET=udyaan-jwt-secret:latest,ADMIN_PASSWORD=udyaan-admin-password:latest,DATABASE_URL=udyaan-database-url:latest,SECRET_KEY=udyaan-secret-key:latest,REDIS_URL=udyaan-redis-url:latest,MAIL_USERNAME=udyaan-mail-username:latest,MAIL_PASSWORD=udyaan-mail-password:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA

services:
  # Local portal database. Isolated from any deployed instance on purpose:
  # the API runs create_all on boot, so dev must never point at production.
  #
  # pgvector build rather than stock postgres: RDS has the `vector` extension,
  # and without it locally the community ranking silently degrades to tag
  # overlap (`community_ranking: tags-only` in /health). That leaves the
  # embedding branch of the suggestion query — a different SQL path, not just a
  # different score — never exercised in development. Same major version as
  # postgres:16-alpine, so an existing data volume keeps working.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: udyaan
      POSTGRES_PASSWORD: udyaan_local_dev
      POSTGRES_DB: udyaan
    ports:
      - "5433:5432"
    volumes:
      - portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udyaan -d udyaan"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OTP storage and the presence/typing pub-sub. Production points at Upstash;
  # locally this stands in so the messaging features can actually be exercised.
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Overrides the .env value so the local stack never talks to Upstash.
      REDIS_URL: redis://redis:6379/0
      # S3 credentials come from the host session (`aws login`), not from .env:
      # `aws login` issues temporary credentials that expire, so writing them to
      # a file would leave a stale copy behind. In production these are unset and
      # botocore falls back to the App Runner instance role.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api-data:
  portal-db:

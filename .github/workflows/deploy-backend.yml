name: Deploy backend

# Replaces Cloud Build. Only backend paths trigger it — the frontend deploys
# from Vercel off the same branch and must not be coupled to this pipeline.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: udyaan-api
  ECS_CLUSTER: udyaan
  ECS_SERVICE: udyaan-api
  TASK_FAMILY: udyaan-api
  API_URL: https://api.udyaan.org

# Two deploys racing would leave the service on whichever image finished last
# rather than the newest commit.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  # Required for OIDC. Nothing here uses a long-lived AWS access key.
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::209483892786:role/udyaan-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          set -euo pipefail
          URI="$REGISTRY/$ECR_REPOSITORY:$TAG"
          # App Runner runs on x86; a build from an arm machine would otherwise
          # produce an image the service cannot start.
          docker build --platform linux/amd64 -t "$URI" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$URI"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          # Re-register the existing task definition with only the image swapped,
          # so environment and secret bindings are carried over untouched rather
          # than re-declared here and silently drifting.
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" --query taskDefinition > /tmp/td.json
          python3 - <<'PY'
          import json, os
          td = json.load(open('/tmp/td.json'))
          for key in ('taskDefinitionArn','revision','status','requiresAttributes',
                      'compatibilities','registeredAt','registeredBy','deregisteredAt'):
              td.pop(key, None)
          td['containerDefinitions'][0]['image'] = os.environ['IMAGE']
          json.dump(td, open('/tmp/td-new.json','w'))
          PY
          REVISION="$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json \
            --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "registered $REVISION"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$REVISION" --region "$AWS_REGION" >/dev/null

      - name: Wait for the new revision to serve
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Verify health
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if body="$(curl -fsS --max-time 20 "$API_URL/health")"; then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            sleep 10
          done
          echo "Health check never returned ok." >&2
          exit 1

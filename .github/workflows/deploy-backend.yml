name: Deploy backend

# Replaces Cloud Build. Only backend paths trigger it — the frontend deploys
# from Vercel off the same branch and must not be coupled to this pipeline.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  API_URL: https://api.udyaan.org

# Two deploys racing would leave the service on whichever image finished last
# rather than the newest commit.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: udyaan_problem_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify problem submission API
        env:
          TEST_PROBLEM_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/udyaan_problem_test
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend/tests -p test_problem_submissions.py -v

      # The API runs on a single Lightsail host (backend/deploy/lightsail). The
      # env file lives on the host and is only re-rendered by deploy.sh from a
      # laptop, so CI ships the image and compose files and nothing else.
      - name: Build image
        working-directory: backend
        run: docker build --platform linux/amd64 -t udyaan-api:current .

      - name: Ship to Lightsail and restart
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/key.pem
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/key.pem
          SSH="ssh -i $HOME/key.pem -o StrictHostKeyChecking=accept-new ubuntu@$LIGHTSAIL_HOST"
          docker save udyaan-api:current | gzip | $SSH 'gunzip | docker load'
          scp -i ~/key.pem -o StrictHostKeyChecking=accept-new \
            backend/deploy/lightsail/docker-compose.yml backend/deploy/lightsail/Caddyfile \
            "ubuntu@$LIGHTSAIL_HOST:/opt/udyaan/"
          $SSH 'cd /opt/udyaan && docker compose up -d --remove-orphans && docker image prune -f >/dev/null'
          rm -f ~/key.pem

      - name: Verify health
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if body="$(curl -fsS --max-time 20 "$API_URL/health")"; then
              echo "$body"
              echo "$body" | grep -q '"status":"ok"' && exit 0
            fi
            sleep 10
          done
          echo "Health check never returned ok." >&2
          exit 1

name: OIDC debug (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC token claims
        run: |
          set -euo pipefail
          TOKEN="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          # Print only the identity claims. The signature is never echoed.
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' \
            | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' \
            | base64 -d | jq '{iss, aud, sub, repository, repository_owner, ref}'
